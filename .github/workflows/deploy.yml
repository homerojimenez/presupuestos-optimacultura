name: Desplegar en SiteGround

# Cada push a main sincroniza la raíz del repo con el public_html del subdominio.
# El proyecto es PHP + HTML/CSS/JS plano: no hay build, se sube tal cual.
on:
  push:
    branches: [main]
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

concurrency:                # evita que dos despliegues se pisen
  group: deploy-siteground
  cancel-in-progress: false

env:
  SSH_PORT: '18765'         # SiteGround no usa el 22

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      # La clave del host va anclada en un secreto en vez de resolverse con
      # ssh-keyscan en cada ejecución: SiteGround limita conexiones seguidas por
      # IP y un keyscan fallido tumbaba el despliegue. Anclada también evita
      # aceptar a ciegas la clave que responda. Si el servidor cambiara de clave
      # el deploy fallará a propósito: entonces hay que regenerar el secreto con
      #   ssh-keyscan -p 18765 ssh.optimacultura.es | gh secret set SSH_KNOWN_HOSTS
      - name: Preparar la clave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Reintentos porque el servidor puede rechazar conexiones seguidas.
      - name: Comprobar la conexión
        run: |
          for intento in 1 2 3; do
            if ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=20 \
                 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
                 "test -d '${{ secrets.REMOTE_PATH }}'"; then
              echo "Destino OK: ${{ secrets.REMOTE_PATH }}"
              exit 0
            fi
            echo "Intento $intento fallido; reintento en 15s"
            sleep 15
          done
          echo "No se pudo conectar con el servidor"
          exit 1

      # --delete deja el servidor idéntico al repo, salvo lo excluido:
      #   data/           base de datos e imágenes subidas (viven solo en el servidor)
      #   api/config.php  credenciales de MySQL y claves de IA
      # Sin esas dos exclusiones cada despliegue borraría el histórico y la config.
      - name: Sincronizar con rsync
        run: |
          rsync -az --delete --human-readable --stats \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.claude/' \
            --exclude 'node_modules/' \
            --exclude '.env' \
            --exclude '.DS_Store' \
            --exclude '.gitignore' \
            --exclude 'data/' \
            --exclude 'api/config.php' \
            --exclude 'router.php' \
            --exclude '*.zip' \
            --exclude 'README.md' \
            --exclude 'DEPLOY.md' \
            --exclude 'LEEME-SITEGROUND.txt' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}"

      - name: Limpiar la clave
        if: always()
        run: rm -f ~/.ssh/deploy_key
